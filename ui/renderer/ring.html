<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self';">
  <link rel="stylesheet" href="../node_modules/@fortawesome/fontawesome-free/css/all.min.css">
  <style>
    :root, [data-theme="light"], [data-theme="ubuntu"] { --disc: rgba(250,250,252,.96); --fg: rgba(0,0,0,.85); --dim: rgba(0,0,0,.5); --sep: rgba(0,0,0,.08); --hov: rgba(53,132,228,.16); --acc: #3584e4; --shadow: 0 18px 50px rgba(0,0,0,.28); --hub: #fff; }
    [data-theme="dark"], [data-theme="ubuntu-dark"] { --disc: rgba(40,40,44,.96); --fg: #fff; --dim: rgba(255,255,255,.5); --sep: rgba(255,255,255,.1); --hov: rgba(53,132,228,.32); --acc: #6aa9ff; --shadow: 0 18px 50px rgba(0,0,0,.6); --hub: #2e2e32; }
    [data-theme="ubuntu"] { --acc: #e95420; --hov: rgba(233,84,32,.16); }
    [data-theme="ubuntu-dark"] { --acc: #ff8a5b; --hov: rgba(233,84,32,.34); }
    html, body { margin: 0; background: transparent; height: 100%; overflow: hidden; }
    body { font: 12px Cantarell, "Adwaita Sans", "Noto Sans", Inter, system-ui, sans-serif; color: var(--fg); user-select: none; -webkit-user-select: none; cursor: default; }
    #ring { position: absolute; inset: 0; }
    svg { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 12px 30px rgba(0,0,0,.35)); }
    svg .wedge { fill: var(--disc); stroke: var(--sep); stroke-width: 1; transition: fill .08s; }
    svg .wedge.on { fill: var(--hov); }
    svg .wedge.empty { fill: var(--disc); }
    svg .hub { fill: var(--hub); stroke: var(--sep); }
    .slot { position: absolute; width: 74px; margin-left: -37px; margin-top: -24px; text-align: center; pointer-events: none; }
    .slot i { display: block; font-size: 17px; margin-bottom: 5px; color: var(--fg); }
    .slot span { display: block; font-size: 10.5px; line-height: 1.15; color: var(--dim); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .slot.on i, .slot.on span { color: var(--acc); }
    .slot.empty i, .slot.empty span { opacity: .32; }
    #hub { position: absolute; left: 50%; top: 50%; width: 96px; margin-left: -48px; margin-top: -30px; height: 60px; text-align: center; pointer-events: none; display: flex; flex-direction: column; justify-content: center; }
    #hub .t { font-size: 11.5px; font-weight: 600; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    #hub .s { font-size: 10px; color: var(--dim); margin-top: 2px; }
    /* held on a button that steers the ring: the pointer is frozen underneath, so it is hidden
       and a knob shows where the hand has moved to */
    body.raw, body.raw * { cursor: none !important; }
    #knob { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 0 3px rgba(255,255,255,.85), 0 2px 8px rgba(0,0,0,.35); pointer-events: none; display: none; left: 50%; top: 50%; }
    body.raw #knob { display: block; }
  </style>
</head>
<body>
  <div id="ring"><svg id="svg" viewBox="0 0 340 340"></svg><div id="slots"></div><div id="hub"><div class="t">Action ring</div><div class="s">Esc closes</div></div><div id="knob"></div></div>
  <script src="ring.js"></script>
</body>
</html>
