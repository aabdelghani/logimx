name: release
on:
  push:
    tags: ['v*']
    # every push to the cross-platform branch builds all three, without publishing anything
    branches: ['feature/cross-platform']
  workflow_dispatch:

# the default token is read-only; creating the release and attaching files needs write
permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ libx11-dev libfuse2
      - name: UI dependencies
        run: cd ui && npm ci --no-audit --no-fund
      - name: Debian package
        run: packaging/deb/build.sh
      - name: AppImage
        run: cd ui && npx electron-builder --linux AppImage --publish never
      # repacked with the current AppImage runtime (no libfuse2 needed) and update information, so
      # AppImageUpdate and similar tools can update it from the latest release's .zsync
      - name: AppImage update information
        run: |
          curl -fsSL -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          cd ui/dist
          f=$(ls NotLogi-*-x86_64.AppImage)
          "./$f" --appimage-extract > /dev/null
          rm "$f"
          ARCH=x86_64 /tmp/appimagetool -u "gh-releases-zsync|aabdelghani|notlogi|latest|NotLogi-*-x86_64.AppImage.zsync" squashfs-root "$f"
          rm -rf squashfs-root
          "./$f" --appimage-updateinformation
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            ui/dist/*.AppImage
            ui/dist/*.AppImage.zsync
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            ui/dist/*.AppImage
            ui/dist/*.AppImage.zsync

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # the same clang toolchain the agent is developed with (llvm-mingw): one static exe,
      # no Visual C++ runtime to install beside it
      - name: Toolchain
        shell: pwsh
        run: |
          $v = '20260922'
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/$v/llvm-mingw-$v-ucrt-x86_64.zip" -OutFile llvm-mingw.zip
          Expand-Archive llvm-mingw.zip -DestinationPath C:\llvm-mingw
          "C:\llvm-mingw\llvm-mingw-$v-ucrt-x86_64\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Agent
        run: |
          cmake -S agent -B agent/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_C_COMPILER=x86_64-w64-mingw32-clang -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-clang++
          cmake --build agent/build
      - name: UI dependencies
        run: cd ui && npm ci --no-audit --no-fund
      - name: Installer
        run: cd ui && npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ui/dist/*-Setup-*.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ui/dist/*-Setup-*.exe

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Agent (Apple Silicon and Intel in one binary)
        run: |
          cmake -S agent -B agent/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build agent/build -j 4
          lipo -info agent/build/logimx-agent
      - name: UI dependencies
        run: cd ui && npm ci --no-audit --no-fund
      - name: Disk images
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: cd ui && npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            ui/dist/*.dmg
            ui/dist/*.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ui/dist/*.dmg
            ui/dist/*.zip
